    />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumi – Personalized Beauty, Skincare & Wellness Guidance" />
    <meta
      property="og:description"
      content="Lumi is your personal beauty companion for skincare, haircare and wellness. Tailored routines, habit tracking, clinical guides, and dark mode for evening rituals."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Dark Mode inline script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('lumie.theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
